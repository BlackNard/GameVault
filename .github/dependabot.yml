version: 2
updates:
  # Packages use exact versions plus committed packages.lock.json files. Dependabot edits the
  # version; a maintainer must regenerate and review the lock files (docs/development.md).
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /tests/Fixtures/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    assignees: [BlackNard]
    labels: [dependencies]
    groups:
      nuget-weekly:
        patterns: ['*']
  # Actions are pinned by commit SHA with a version comment; Dependabot keeps both in step.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    assignees: [BlackNard]
    labels: [dependencies]
    groups:
      actions-weekly:
        patterns: ['*']
