name: Windows verification and private draft assets

on:
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: 'Optional unpublished private draft ID to download and smoke-test'
        required: false
        type: string
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Build, tests, installer and release-bundle checks. The PR gate is the `verify` job below.
  build:
    name: Build, test, installer and release bundle
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      GAMEVAULT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that commits expose no personal e-mail address
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # After a force-push the "before" commit no longer exists; then fall back to the last 50 commits instead of failing.
          $beforeUsable = $false
          if ($env:PUSH_BEFORE -and $env:PUSH_BEFORE -notmatch '^0+$') { git cat-file -e "$($env:PUSH_BEFORE)^{commit}" 2>$null; $beforeUsable = ($LASTEXITCODE -eq 0) }
          if ($env:PR_BASE) { ./scripts/audit-commit-emails.ps1 -Range "$($env:PR_BASE)..$($env:GAMEVAULT_HEAD_SHA)" }
          elseif ($beforeUsable) { ./scripts/audit-commit-emails.ps1 -Range "$($env:PUSH_BEFORE)..$($env:GAMEVAULT_HEAD_SHA)" }
          else { ./scripts/audit-commit-emails.ps1 }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            global.json
      - name: Build, test, and verify self-contained publish
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Test clean installer payload boundaries
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Test capture package prerequisite and notice boundaries
        shell: pwsh
        run: ./scripts/test-capture-packaging.ps1
      - name: Test release evidence and asset boundaries
        shell: pwsh
        run: ./scripts/test-release.ps1
      - name: Audit reachable source history
        shell: pwsh
        run: ./scripts/audit-release-source.ps1
      - name: Compile development setup wizard (does not install)
        shell: pwsh
        run: |
          $verified = Get-Content artifacts/verification.json -Raw | ConvertFrom-Json
          ./scripts/build-installer.ps1 -PublishDirectory $verified.publishDirectory
      - name: Verify silent install, upgrade and preserving uninstall on disposable runner
        shell: pwsh
        run: ./scripts/verify-installer-lifecycle.ps1
      - name: Prepare verified private draft assets (never publishes)
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Keep verified private draft assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: private-draft-assets
          path: artifacts/release-*/*
          if-no-files-found: error
          retention-days: 7
      - name: Keep test and synthetic performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-one-automated-evidence
          path: artifacts/test-results-*/*.trx
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep synthetic installer lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-lifecycle-evidence
          path: |
            artifacts/installer-lifecycle-*/report.json
            artifacts/installer-lifecycle-*/*.log
            artifacts/installer-lifecycle-*/*.stderr
          if-no-files-found: ignore
          retention-days: 7

  # Independent of the release bundle, so it runs in parallel with `verify`.
  capture-encode-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            global.json
      - name: Prepare image-only native encoder on disposable runner
        shell: pwsh
        run: ./scripts/prepare-capture-probe-runner.ps1
      - name: Build the capture probe tests
        shell: pwsh
        run: |
          dotnet restore tests/GameVault.App.Tests/GameVault.App.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed.' }
          dotnet build tests/GameVault.App.Tests/GameVault.App.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
      - name: Prove synthetic image-only native MP4 encoding and finalization
        shell: pwsh
        env:
          GAMEVAULT_CAPTURE_ENCODE_PROBE: '1'
        run: dotnet test tests/GameVault.App.Tests/GameVault.App.Tests.csproj -c Release --no-build --no-restore --filter FullyQualifiedName~CaptureEncodeProbeTests --logger trx --results-directory artifacts/capture-encode-probe --blame-hang-timeout 90s
      - name: Keep capture probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capture-encode-probe-evidence
          path: artifacts/capture-encode-probe/**
          if-no-files-found: ignore
          retention-days: 7

  # The slowest step by far; independent of the release bundle, so it runs in parallel with `verify`.
  performance-harness:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            global.json
      - name: Measure synthetic library storage and query performance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet restore tests/PerformanceHarness/PerformanceHarness.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Performance harness locked restore failed.' }
          dotnet run --project tests/PerformanceHarness/PerformanceHarness.csproj -c Release --no-restore 2>&1 | Tee-Object -FilePath artifacts/performance-harness.txt
          if ($LASTEXITCODE -ne 0) { throw 'Performance harness failed.' }
      - name: Keep synthetic performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-harness-evidence
          path: artifacts/performance-harness.txt
          if-no-files-found: ignore
          retention-days: 7

  # The single required PR check: passes only when every parallel job above passed.
  verify:
    needs: [build, capture-encode-probe, performance-harness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "A verification job did not succeed ($r)."; exit 1; fi
          done

  draft-asset-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release_id != ''
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    # GitHub draft visibility requires push access. Script only reads an existing
    # unpublished draft; it cannot create/publish a release or change visibility.
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Download, verify and smoke-test exact draft asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GAMEVAULT_DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          # The owner made the repository public and authorized releases from it; the script still only reads an unpublished draft.
          GAMEVAULT_PUBLIC_REPOSITORY_APPROVED: 'true'
        run: ./scripts/smoke-draft-release.ps1 -ReleaseId $env:GAMEVAULT_DRAFT_RELEASE_ID
      - name: Keep exact draft smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exact-draft-asset-smoke-evidence
          path: artifacts/draft-asset-smoke/*
          if-no-files-found: ignore
          retention-days: 7
